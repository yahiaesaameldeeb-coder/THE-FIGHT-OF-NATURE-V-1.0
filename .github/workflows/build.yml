name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip, Fix Duplicate Resource and Build
        run: |
          # فك ضغط ملف الـ ZIP إن وجد
          find . -name "*.zip" -exec unzip -o {} \;

          # حذف ملف styles.xml لمنع تكرار AppTheme مع themes.xml
          find . -path "*/src/main/res/values/styles.xml" -exec rm -f {} \;

          # البحث عن gradlew والبناء
          TARGET_DIR=$(find . -name "gradlew" -exec dirname {} \; | head -n 1)

          if [ -n "$TARGET_DIR" ]; then
            cd "$TARGET_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            BUILD_FILE=$(find . -name "build.gradle" -not -path "*/app/*" -print -quit)
            cd $(dirname "$BUILD_FILE")
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TheFightOfNature-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'






