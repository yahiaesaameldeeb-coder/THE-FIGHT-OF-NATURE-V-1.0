name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Locate and Build with Gradle Wrapper
        run: |
          # البحث عن مجلد المشروع الذي يحتوي على gradlew
          TARGET_DIR=$(find . -name "gradlew" -exec dirname {} \; | head -n 1)
          
          if [ -z "$TARGET_DIR" ]; then
            echo "لم يتم العثور على ملف gradlew"
            exit 1
          fi
          
          cd "$TARGET_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TheFightOfNature-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'




